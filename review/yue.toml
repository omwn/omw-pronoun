# Cantonese pro-forms for the OMW pronoun wordnet.
# NOT from TUFS (TUFS has no Cantonese): written by Claude Opus 5.5 from its own knowledge,
# for a speaker to check. Romanization is Jyutping. One table per concept; edit `comment`.
# Parabank's Cantonese (Yale/IPA only) agrees on the six personal pronouns.

